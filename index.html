<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scanlines"></div>
  <div class="grid-bg"></div>

  <aside id="players">
    <h2>Players</h2>
    <ul id="user-list"></ul>
  </aside>

  <div id="scoreboard">
    <div class="score-box score-x">
      <span class="score-label" id="name-x">X</span>
      <span class="score-value" id="score-x">0</span>
    </div>
    <div class="score-box score-o">
      <span class="score-label" id="name-o">O</span>
      <span class="score-value" id="score-o">0</span>
    </div>
  </div>

  <main class="arena">
    <h1 class="title" data-text="XOXO">XOXO</h1>
    <p id="status">X's turn</p>

    <div id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <button id="reset">Reset</button>
  </main>

  <dialog id="auth" aria-labelledby="auth-title">
    <form id="auth-form">
      <h2 id="auth-title">Log in</h2>
      <label>
        Username
        <input id="auth-username" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+" title="3 to 16 letters, numbers, or underscores" autocomplete="username" autocapitalize="none" spellcheck="false">
      </label>
      <label>
        Password
        <input id="auth-password" type="password" required minlength="8" title="At least 8 characters" autocomplete="current-password">
      </label>
      <label id="auth-confirm-row" hidden>
        Confirm password
        <input id="auth-confirm" type="password" autocomplete="new-password">
      </label>
      <p id="auth-error" role="alert"></p>
      <button id="auth-submit" type="submit">Log in</button>
      <button id="auth-switch" type="button">New here? Create an account</button>
      <button id="auth-cancel" type="button">Cancel</button>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
